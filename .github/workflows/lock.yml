name: 'Lock threads'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    permissions:
      issues: write  # for dessant/lock-threads to lock issues
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v6
        with:
          github-token: ${{ github.token }}
          process-only: 'issues'
          issue-inactive-days: 365
